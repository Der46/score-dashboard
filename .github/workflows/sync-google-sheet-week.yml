name: Sync Google Sheet Weekly Score

on:
  schedule:
    # GitHub Actions cron 使用 UTC
    # 每 3 小時執行一次，避開整點排程尖峰
    #
    # 自動週別切換規則：
    # - 每週一是週別起始日
    # - 但 Google Sheet 當週分頁通常要等資料整理完成
    # - 因此自動同步延後到「台灣時間每週三 21:00」才切換到當週
    # - 在週三 21:00 以前，仍繼續同步上一週
    - cron: "17 */3 * * *"

  workflow_dispatch:
    inputs:
      week_id:
        description: "週別 ID，例如 2026-06-w2。留空則自動依台灣時間與週三 21:00 規則判斷"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-google-sheet-week
  cancel-in-progress: false

jobs:
  sync-week:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 週別判斷邏輯在 scripts/week_utils.py（有單元測試），與 update_weeks_csv.py 共用。
      - name: Resolve week id
        id: resolve_week
        env:
          INPUT_WEEK_ID: ${{ github.event.inputs.week_id || '' }}
        run: |
          python scripts/resolve_week.py

      # 結束代碼 3 = 找不到週別分頁、4 = 分頁還沒有成員資料（例如剛從範本建立）：
      # 這兩種是永久性狀態，不重試；自動模式下改同步上一週，避免新週分頁還沒準備好時整個同步失敗。
      # 下載腳本本身已有 HTTP 層的重試，這裡只再重試整個下載 2 次。
      - name: Download and convert Google Sheet week
        id: download
        timeout-minutes: 25
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          RESOLVED_WEEK_ID: ${{ steps.resolve_week.outputs.week_id }}
          FALLBACK_WEEK_ID: ${{ steps.resolve_week.outputs.fallback_week_id }}
        run: |
          sync_week() {
            local code=0

            for attempt in 1 2; do
              code=0
              WEEK_ID="$1" python scripts/download_google_sheet_week.py || code=$?

              if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
                break
              fi

              if [ "$attempt" -lt 2 ]; then
                echo "下載失敗（第 ${attempt} 次，exit ${code}），60 秒後重試"
                sleep 60
              fi
            done

            if [ "$code" -ne 0 ]; then
              return "$code"
            fi

            INPUT_XLSX="work/$1.xlsx" OUTPUT_CSV="data/$1.csv" python scripts/convert_excel_to_csv.py || code=$?

            return "$code"
          }

          WEEK_ID="$RESOLVED_WEEK_ID"
          code=0
          sync_week "$WEEK_ID" || code=$?

          if { [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; } && [ -n "$FALLBACK_WEEK_ID" ]; then
            echo "::warning::${WEEK_ID} 分頁尚未建立或還沒有成員資料，改同步上一週 ${FALLBACK_WEEK_ID}"
            WEEK_ID="$FALLBACK_WEEK_ID"
            code=0
            sync_week "$WEEK_ID" || code=$?
          fi

          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          echo "week_id=${WEEK_ID}" >> "$GITHUB_OUTPUT"

      - name: Check whether score data needs update
        id: check_changes
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
        run: |
          CSV_FILE="data/${WEEK_ID}.csv"
          WEEKS_FILE="data/weeks.csv"

          NEED_UPDATE=false

          if [ ! -f "$CSV_FILE" ]; then
            echo "找不到轉換後的 CSV 檔案：$CSV_FILE"
            exit 1
          fi

          if ! git ls-files --error-unmatch "$CSV_FILE" > /dev/null 2>&1; then
            echo "CSV 是新檔案，需要提交：$CSV_FILE"
            NEED_UPDATE=true
          elif git diff --quiet -- "$CSV_FILE"; then
            echo "CSV 沒有內容變更：$CSV_FILE"
          else
            echo "CSV 有內容變更，需要提交：$CSV_FILE"
            NEED_UPDATE=true
          fi

          if [ ! -f "$WEEKS_FILE" ]; then
            echo "weeks.csv 不存在，需要建立"
            NEED_UPDATE=true
          elif ! grep -q "^${WEEK_ID}," "$WEEKS_FILE"; then
            echo "weeks.csv 尚未包含 ${WEEK_ID}，需要更新"
            NEED_UPDATE=true
          else
            echo "weeks.csv 已包含 ${WEEK_ID}"
          fi

          echo "need_update=${NEED_UPDATE}" >> "$GITHUB_OUTPUT"

      - name: Update weeks.csv
        if: steps.check_changes.outputs.need_update == 'true'
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
        run: |
          python scripts/update_weeks_csv.py

      # 只有成績資料真的有變時才更新時間戳：分數沒變就不 commit，
      # 避免每 3 小時都產生一筆 commit 並觸發 GitHub Pages 重新部署。
      # 網頁上顯示的是「資料最後更新時間」；同步是否正常請看 Actions 執行紀錄。
      - name: Write data updated time
        if: steps.check_changes.outputs.need_update == 'true'
        run: |
          mkdir -p data
          echo "{\"updatedAt\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/updated-at.json

      - name: Show changed files
        run: |
          git status --short

      # 推送前先 rebase 到最新的遠端分支，避免同一時間有人推送時被拒絕而遺失這次同步。
      # 衝突時以這次同步的資料為準（-X theirs 在 rebase 中指的是正在重放的本次 commit）；
      # rebase 失敗時先中止，避免下一次重試卡在 rebase 進行中的狀態。
      - name: Commit and push changes
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "data/${WEEK_ID}.csv" data/weeks.csv data/updated-at.json

          if git diff --cached --quiet; then
            echo "沒有檔案需要提交"
            exit 0
          fi

          git commit -m "Update weekly score data for ${WEEK_ID}"

          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "推送失敗（第 ${attempt} 次），10 秒後重試"
            sleep 10
          done

          exit 1

      - name: Sync summary
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
          NEED_UPDATE: ${{ steps.check_changes.outputs.need_update }}
        run: |
          if [ "$NEED_UPDATE" = "true" ]; then
            echo "本次同步成功，且成績資料或 weeks.csv 有更新：${WEEK_ID}"
          else
            echo "本次同步成功，成績資料沒有變更，不需要提交。"
          fi
