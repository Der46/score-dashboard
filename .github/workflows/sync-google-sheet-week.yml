name: Sync Google Sheet Weekly Score

on:
  schedule:
    # GitHub Actions cron 使用 UTC
    # 每 3 小時執行一次，避開整點排程尖峰
    #
    # 自動週別切換規則：
    # - 每週一是週別起始日
    # - 但 Google Sheet 當週分頁通常要等資料整理完成
    # - 因此自動同步延後到「台灣時間每週三 21:00」才切換到當週
    # - 在週三 21:00 以前，仍繼續同步上一週
    - cron: "17 */3 * * *"

  workflow_dispatch:
    inputs:
      week_id:
        description: "週別 ID，例如 2026-06-w2。留空則自動依台灣時間與週三 21:00 規則判斷"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sync-google-sheet-week
  cancel-in-progress: false

jobs:
  sync-week:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve week id
        id: resolve_week
        env:
          INPUT_WEEK_ID: ${{ github.event.inputs.week_id || '' }}
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, date, time, timedelta
          from zoneinfo import ZoneInfo

          input_week_id = os.environ.get("INPUT_WEEK_ID", "").strip()
          week_id_pattern = re.compile(r"\d{4}-\d{2}-w\d+")

          # 自動週別切換時間設定：
          # Python weekday(): Monday=0, Tuesday=1, Wednesday=2
          # 這裡設定為每週三 21:00，台灣時間。
          SWITCH_WEEKDAY = 2
          SWITCH_HOUR = 21
          SWITCH_MINUTE = 0

          def first_monday_of_month(year, month):
              first_day = date(year, month, 1)
              days_to_monday = (0 - first_day.weekday()) % 7
              return first_day + timedelta(days=days_to_monday)

          def get_week_id_from_date(current_date):
              year = current_date.year
              month = current_date.month

              first_monday = first_monday_of_month(year, month)

              if current_date < first_monday:
                  if month == 1:
                      year -= 1
                      month = 12
                  else:
                      month -= 1

                  first_monday = first_monday_of_month(year, month)

              week_index = ((current_date - first_monday).days // 7) + 1

              return f"{year:04d}-{month:02d}-w{week_index}"

          def get_week_start_from_date(current_date):
              year = current_date.year
              month = current_date.month

              first_monday = first_monday_of_month(year, month)

              if current_date < first_monday:
                  if month == 1:
                      year -= 1
                      month = 12
                  else:
                      month -= 1

                  first_monday = first_monday_of_month(year, month)

              week_index = ((current_date - first_monday).days // 7) + 1
              week_start = first_monday + timedelta(days=(week_index - 1) * 7)

              return week_start

          def resolve_auto_week_id(now):
              today = now.date()
              current_week_start = get_week_start_from_date(today)

              switch_date = current_week_start + timedelta(days=SWITCH_WEEKDAY)
              switch_datetime = datetime.combine(
                  switch_date,
                  time(SWITCH_HOUR, SWITCH_MINUTE),
                  tzinfo=now.tzinfo
              )

              # 切換到當週後，若當週分頁還沒建立，改同步上一週（fallback_week_id）。
              fallback_week_id = ""

              if now < switch_datetime:
                  effective_date = current_week_start - timedelta(days=1)
                  switch_status = "before weekly switch time, use previous week"
              else:
                  effective_date = today
                  switch_status = "after weekly switch time, use current week"
                  fallback_week_id = get_week_id_from_date(current_week_start - timedelta(days=1))

              week_id = get_week_id_from_date(effective_date)

              return week_id, fallback_week_id, effective_date, switch_datetime, switch_status

          fallback_week_id = ""

          if input_week_id:
              if not week_id_pattern.fullmatch(input_week_id):
                  raise ValueError(
                      f"week_id 格式錯誤：{input_week_id}，應為 yyyy-MM-wN，例如 2026-06-w2"
                  )

              week_id = input_week_id
              source = "manual input"
          else:
              now = datetime.now(ZoneInfo("Asia/Taipei"))

              week_id, fallback_week_id, effective_date, switch_datetime, switch_status = resolve_auto_week_id(now)

              source = (
                  f"auto from Asia/Taipei datetime {now.isoformat()}, "
                  f"effective week date {effective_date.isoformat()}, "
                  f"weekly switch datetime {switch_datetime.isoformat()}, "
                  f"{switch_status}"
              )

          print(f"Resolved WEEK_ID={week_id} fallback={fallback_week_id or '-'} ({source})")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"week_id={week_id}\n")
              output.write(f"fallback_week_id={fallback_week_id}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl requests

      # 下載腳本結束代碼 3 = 找不到週別分頁：這是永久性錯誤，不重試；
      # 自動模式下改同步上一週，避免新週分頁還沒建立時整個同步失敗。
      - name: Download Google Sheet week as XLSX
        id: download
        timeout-minutes: 15
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          RESOLVED_WEEK_ID: ${{ steps.resolve_week.outputs.week_id }}
          FALLBACK_WEEK_ID: ${{ steps.resolve_week.outputs.fallback_week_id }}
        run: |
          download() {
            local code=0

            for attempt in 1 2 3; do
              code=0
              WEEK_ID="$1" python scripts/download_google_sheet_week.py || code=$?

              if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
                return "$code"
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "下載失敗（第 ${attempt} 次，exit ${code}），60 秒後重試"
                sleep 60
              fi
            done

            return "$code"
          }

          WEEK_ID="$RESOLVED_WEEK_ID"
          code=0
          download "$WEEK_ID" || code=$?

          if [ "$code" -eq 3 ] && [ -n "$FALLBACK_WEEK_ID" ]; then
            echo "::warning::找不到 ${WEEK_ID} 分頁，改同步上一週 ${FALLBACK_WEEK_ID}"
            WEEK_ID="$FALLBACK_WEEK_ID"
            code=0
            download "$WEEK_ID" || code=$?
          fi

          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          echo "week_id=${WEEK_ID}" >> "$GITHUB_OUTPUT"

      - name: Convert XLSX to dashboard CSV
        env:
          INPUT_XLSX: work/${{ steps.download.outputs.week_id }}.xlsx
          OUTPUT_CSV: data/${{ steps.download.outputs.week_id }}.csv
        run: |
          python scripts/convert_excel_to_csv.py

      - name: Check whether score data needs update
        id: check_changes
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
        run: |
          CSV_FILE="data/${WEEK_ID}.csv"
          WEEKS_FILE="data/weeks.csv"

          NEED_UPDATE=false

          if [ ! -f "$CSV_FILE" ]; then
            echo "找不到轉換後的 CSV 檔案：$CSV_FILE"
            exit 1
          fi

          if ! git ls-files --error-unmatch "$CSV_FILE" > /dev/null 2>&1; then
            echo "CSV 是新檔案，需要提交：$CSV_FILE"
            NEED_UPDATE=true
          elif git diff --quiet -- "$CSV_FILE"; then
            echo "CSV 沒有內容變更：$CSV_FILE"
          else
            echo "CSV 有內容變更，需要提交：$CSV_FILE"
            NEED_UPDATE=true
          fi

          if [ ! -f "$WEEKS_FILE" ]; then
            echo "weeks.csv 不存在，需要建立"
            NEED_UPDATE=true
          elif ! grep -q "^${WEEK_ID}," "$WEEKS_FILE"; then
            echo "weeks.csv 尚未包含 ${WEEK_ID}，需要更新"
            NEED_UPDATE=true
          else
            echo "weeks.csv 已包含 ${WEEK_ID}"
          fi

          echo "need_update=${NEED_UPDATE}" >> "$GITHUB_OUTPUT"

      - name: Update weeks.csv
        if: steps.check_changes.outputs.need_update == 'true'
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
        run: |
          python scripts/update_weeks_csv.py

      - name: Write successful sync time
        run: |
          mkdir -p data
          echo "{\"updatedAt\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/updated-at.json

      - name: Show changed files
        run: |
          git status --short

      # 推送前先 rebase 到最新的遠端分支，避免同一時間有人推送時被拒絕而遺失這次同步。
      - name: Commit and push changes
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "data/${WEEK_ID}.csv" data/weeks.csv data/updated-at.json

          if git diff --cached --quiet; then
            echo "沒有檔案需要提交"
            exit 0
          fi

          git commit -m "Update weekly score sync timestamp for ${WEEK_ID}"

          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            echo "推送失敗（第 ${attempt} 次），10 秒後重試"
            sleep 10
          done

          exit 1

      - name: Sync summary
        env:
          WEEK_ID: ${{ steps.download.outputs.week_id }}
          NEED_UPDATE: ${{ steps.check_changes.outputs.need_update }}
        run: |
          if [ "$NEED_UPDATE" = "true" ]; then
            echo "本次同步成功，且成績資料或 weeks.csv 有更新：${WEEK_ID}"
          else
            echo "本次同步成功，成績資料沒有變更，但已更新 data/updated-at.json。"
          fi
