<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title data-i18n="page.title">隊伍貢獻總覽</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/icons.js" defer></script>
    <script src="./js/app.js" defer></script>
</head>

<body>
    <div class="app">
        <!-- 側邊欄（桌機） / 底部導覽（手機） -->
        <aside class="rail" aria-label="導覽" data-i18n-attr="aria-label:controls.nav">
            <div class="rail-logo" aria-hidden="true" data-icon="sparkles"></div>

            <nav class="rail-nav" id="railNav">
                <button type="button" class="rail-btn" data-view="month" data-i18n-attr="aria-label:controls.viewMonth;title:controls.viewMonth">
                    <span data-icon="layoutDashboard"></span>
                </button>
                <button type="button" class="rail-btn" data-view="week" data-i18n-attr="aria-label:controls.viewWeek;title:controls.viewWeek">
                    <span data-icon="calendar"></span>
                </button>
                <a class="rail-btn" href="#statsAnchor" data-scroll="stats" data-i18n-attr="aria-label:nav.stats;title:nav.stats">
                    <span data-icon="chartColumn"></span>
                </a>
                <a class="rail-btn" href="#tableAnchor" data-scroll="table" data-i18n-attr="aria-label:nav.table;title:nav.table">
                    <span data-icon="users"></span>
                </a>
            </nav>

            <div class="rail-foot">
                <a class="rail-btn" href="#footnotes" data-scroll="footnotes" data-i18n-attr="aria-label:nav.help;title:nav.help">
                    <span data-icon="info"></span>
                </a>
            </div>
        </aside>

        <main class="page">
            <header class="hero">
                <h1 class="hero-title" data-i18n="hero.title">Coin999-長長久久 隊伍成績總覽</h1>

                <div class="hero-actions">
                    <label class="icon-select" title="Language">
                        <span class="sr-only" data-i18n="controls.language">語言</span>
                        <span class="icon-select-icon" aria-hidden="true" data-icon="globe"></span>
                        <select id="languageSelect">
                            <option value="zh-Hant">繁體中文</option>
                            <option value="en">English</option>
                            <option value="vi">Tiếng Việt</option>
                        </select>
                    </label>

                    <div class="sync-pill" id="updatedAtText" aria-live="polite"></div>
                </div>

                <p class="hero-subtitle" data-i18n="hero.subtitle">
                    以月為單位檢視每位成員的總分、實際投入與未投入分數。
                </p>
            </header>

            <nav class="controls" aria-label="檢視設定" data-i18n-attr="aria-label:controls.bar">
                <div class="tabs" role="tablist" id="viewTabs">
                    <button type="button" role="tab" class="tab" data-view="month" data-i18n="controls.viewMonth">月度總覽</button>
                    <button type="button" role="tab" class="tab" data-view="week" data-i18n="controls.viewWeek">單週明細</button>
                </div>

                <label class="pill-select">
                    <span class="sr-only" data-i18n="controls.period">期間</span>
                    <span class="pill-icon" aria-hidden="true" data-icon="calendar"></span>
                    <select id="periodSelect"></select>
                </label>

                <label class="pill-select">
                    <span class="sr-only" data-i18n="controls.filter">篩選</span>
                    <span class="pill-icon" aria-hidden="true" data-icon="sliders"></span>
                    <select id="filterSelect"></select>
                </label>

                <label class="pill-select">
                    <span class="sr-only" data-i18n="controls.sort">排序</span>
                    <span class="pill-icon" aria-hidden="true" data-icon="arrowUpDown"></span>
                    <select id="sortSelect"></select>
                </label>
            </nav>

            <div id="notice" class="notice" hidden role="status"></div>

            <span id="statsAnchor" class="anchor"></span>
            <section class="stats" id="stats" aria-live="polite"></section>

            <section class="podium" id="podium"></section>

            <span id="tableAnchor" class="anchor"></span>
            <section class="panel" aria-labelledby="tableTitle">
                <div class="panel-head">
                    <div class="panel-heading">
                        <span class="icon-chip" aria-hidden="true" data-icon="list"></span>
                        <div>
                            <h2 id="tableTitle" class="panel-title"></h2>
                            <p class="panel-hint" id="resultHint" aria-live="polite" data-i18n="common.loading">載入中...</p>
                        </div>
                    </div>

                    <label class="pill-search panel-search">
                        <span class="sr-only" data-i18n="controls.searchLabel">搜尋成員</span>
                        <span class="pill-icon" aria-hidden="true" data-icon="search"></span>
                        <input id="searchInput" type="search" autocomplete="off" placeholder="搜尋 CM / LINE 名稱"
                            data-i18n-attr="placeholder:controls.searchPlaceholder" />
                    </label>

                    <div class="legend" aria-hidden="true">
                        <span class="legend-item"><i class="swatch swatch-invested"></i><span data-i18n="metric.invested">實際投入</span></span>
                        <span class="legend-item"><i class="swatch swatch-uninvested"></i><span data-i18n="metric.uninvested">未投入</span></span>
                    </div>
                </div>

                <div class="table-wrap">
                    <table class="score-table" id="scoreTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </section>

            <ul class="footnotes" id="footnotes">
                <li data-i18n="footnote.invested">實際投入：週表「投入」欄位的分數。</li>
                <li data-i18n="footnote.uninvested">未投入：週表「未投入」欄位的分數。</li>
                <li data-i18n="footnote.contribution">貢獻度 = 個人分數 ÷ 全隊總分（含回歸帳號）。</li>
                <li data-i18n="footnote.icons">Icons: Lucide (ISC License)</li>
            </ul>
        </main>
    </div>

    <div class="modal" id="profileModal" hidden>
        <div class="modal-backdrop" data-modal-close></div>

        <article class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="profileName" tabindex="-1">
            <header class="modal-head">
                <div class="modal-heading">
                    <span class="avatar" id="profileAvatar" aria-hidden="true"></span>
                    <div>
                        <h2 class="modal-title" id="profileName"></h2>
                        <div class="modal-meta" id="profileMeta"></div>
                    </div>
                </div>

                <button class="round-btn" id="profileClose" type="button" aria-label="關閉"
                    data-i18n-attr="aria-label:profile.close" data-modal-close>
                    <span data-icon="x"></span>
                </button>
            </header>

            <div class="modal-body" id="profileBody"></div>
        </article>
    </div>

    <div class="chart-tooltip" id="chartTooltip" role="tooltip" hidden></div>
</body>

</html>
