name: Backfill Google Sheet Weeks

# 手動執行：重新下載已存在的週別分頁並重新轉換 CSV。
#
# 用途：
# - 轉換程式新增「投入 / 未投入」欄位後，舊週別 CSV 沒有拆分資料，
#   執行一次即可把 weeks.csv 內所有週別補齊。
# - 某週資料在 Google Sheet 修正後，也可指定週別重新同步。
#
# 單一週別失敗（例如分頁已刪除）不會中斷其他週別，最後會列出失敗清單。

on:
  workflow_dispatch:
    inputs:
      week_ids:
        description: "要回補的週別，以逗號分隔，例如 2026-09-w1,2026-09-w2。輸入 all 代表 weeks.csv 內全部週別"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

concurrency:
  group: sync-google-sheet-week
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download and convert weeks
        id: backfill
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          INPUT_WEEK_IDS: ${{ github.event.inputs.week_ids }}
        run: |
          # -f：週別清單以空白分割時不做萬用字元展開
          set -uf

          if [ "$(echo "$INPUT_WEEK_IDS" | tr -d '[:space:]')" = "all" ]; then
            WEEK_IDS=$(python - <<'PY'
          import csv
          with open("data/weeks.csv", encoding="utf-8-sig") as f:
              print(" ".join(row["id"] for row in csv.DictReader(f) if row.get("id")))
          PY
            )
          else
            WEEK_IDS=$(echo "$INPUT_WEEK_IDS" | tr ',' ' ')
          fi

          FAILED=""

          for WEEK_ID in $WEEK_IDS; do
            echo "::group::${WEEK_ID}"

            if WEEK_ID="$WEEK_ID" python scripts/download_google_sheet_week.py \
              && INPUT_XLSX="work/${WEEK_ID}.xlsx" OUTPUT_CSV="data/${WEEK_ID}.csv" python scripts/convert_excel_to_csv.py; then
              echo "完成：${WEEK_ID}"
            else
              echo "::warning::回補失敗：${WEEK_ID}"
              FAILED="${FAILED} ${WEEK_ID}"
            fi

            echo "::endgroup::"

            # 避免 Google API 請求過於密集
            sleep 3
          done

          if [ -n "$FAILED" ]; then
            echo "以下週別回補失敗：${FAILED}"
          fi

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.csv

          if git diff --cached --quiet; then
            echo "沒有檔案需要提交"
            exit 0
          fi

          git commit -m "Backfill weekly score CSV with invested / uninvested split"

          # 衝突時以本次回補的資料為準；rebase 失敗時先中止，避免下一次重試卡住。
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "推送失敗（第 ${attempt} 次），10 秒後重試"
            sleep 10
          done

          exit 1

      # 成功的週別已在上一步提交；這裡讓有失敗週別的執行顯示為失敗，避免被忽略。
      - name: Fail if any week failed
        if: steps.backfill.outputs.failed != ''
        env:
          FAILED: ${{ steps.backfill.outputs.failed }}
        run: |
          echo "::error::以下週別回補失敗：${FAILED}"
          exit 1
